<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a09">
<title>פרונט · מערכת ניהול</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0a09'/%3E%3Cpath d='M9 24V8h14v3.6h-9.9v3.1h8.6v3.6h-8.6V24z' fill='%23ffd400'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/app.css">
<link rel="manifest" href="./manifest.webmanifest">
</head>
<body>

<!-- ===== סרגל טיימר קבוע ===== -->
<div id="timerbar" class="timerbar"></div>

<div class="shell">
  <!-- ===== ניווט ===== -->
  <nav class="nav" id="nav">
    <div class="nav-brand">
      <span class="logo">F</span>
      <div>
        <div class="nav-title">פרונט</div>
        <div class="nav-sub">מערכת ניהול</div>
      </div>
    </div>
    <div class="nav-links" id="navlinks"></div>
    <div class="nav-foot">
      <button class="btn btn-ghost btn-sm" id="nav-undo" hidden>↶ בטל</button>
      <button class="btn btn-ghost btn-sm" id="nav-export">ייצוא גיבוי</button>
      <div class="nav-hint" id="backup-hint"></div>
    </div>
  </nav>

  <!-- ===== תוכן ===== -->
  <main class="main">
    <header class="topbar">
      <button class="iconbtn only-mobile" id="menu-toggle" aria-label="תפריט">☰</button>
      <div class="capture-wrap">
        <input id="capture" class="capture" autocomplete="off" spellcheck="false"
               placeholder="כתוב כל דבר ואני אסווג לבד…  (Ctrl+K)">
        <button class="capture-btn" id="capture-go">הוסף</button>
      </div>
      <div class="topbar-right">
        <button class="iconbtn" id="search-open" aria-label="חיפוש">🔍</button>
        <span class="clock" id="clock"></span>
      </div>
    </header>
    <div id="capture-feedback" class="capture-feedback"></div>
    <div id="view" class="view"></div>
  </main>
</div>

<!-- ===== מודאל כללי ===== -->
<div class="modal-back" id="modal-back">
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<!-- ===== טוסטים ===== -->
<div class="toasts" id="toasts"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
