[build]
  publish = "."
  functions = "netlify/functions"
  command = ""

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# האפליקציה משתמשת בניתוב hash (#/time), אז אין צורך ב-SPA rewrite.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

# דף הנחיתה יושב כאן רק כדי לעבור לריפו שלו. עד שיעבור, שלא
# ייסרק מהדומיין של המערכת — שני עותקים מאונדקסים של אותו דף
# הם בעיה שאין ממנה חזרה מהירה.
[[headers]]
  for = "/landing/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
